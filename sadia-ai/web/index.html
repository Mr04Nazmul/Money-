<!doctype html><html lang="bn"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sadia AI</title><style>body{font:16px system-ui;background:#071a1e;color:#f4f7f7;max-width:620px;margin:24px auto;padding:16px}main{background:#123238;padding:24px;border-radius:24px}input,textarea,button{display:block;box-sizing:border-box;width:100%;margin:10px 0;padding:12px;border-radius:10px;border:0}button{background:#efbf78;color:#1b2021;font-weight:bold}img{max-width:240px;border-radius:20px;display:block;margin:auto}audio{width:100%}label{display:block;margin-top:16px}small{color:#c0d1d4}</style><main><h1>সাদিয়া AI — Voice Studio</h1><p>নিজের ছবি ও কণ্ঠের নমুনা ব্যবহার করে বাংলা ভয়েস তৈরি করুন।</p><label>ছবি<input id="portrait" type="file" accept="image/*"></label><img id="preview" hidden alt="Portrait preview"><label>Private API URL<input id="url" value="http://localhost:8000" placeholder="https://your-private-server"></label><label>Private API key<input id="key" type="password" autocomplete="off"></label><label>নিজের WAV কণ্ঠ<input id="voice" type="file" accept=".wav,audio/wav"></label><label>রেকর্ডিংয়ে ঠিক যা বলা হয়েছে<textarea id="ref" rows="2"></textarea></label><label>সাদিয়া যা বলবে<textarea id="text" rows="3">হ্যালো, কেমন আছো?</textarea></label><label><input id="consent" type="checkbox" style="display:inline;width:auto"> কণ্ঠ ও ছবির ব্যবহার অনুমোদিত</label><button id="generate">বাংলা ভয়েস তৈরি করো</button><p id="status" role="status"></p><audio id="player" controls></audio><small>Voice synthesis prototype; video-call lip-sync is not yet implemented. The audio is sent to the selected private server for inference, not uploaded to GitHub.</small></main><script>const $=id=>document.getElementById(id);let photoUrl,voiceUrl;$("portrait").onchange=()=>{if(photoUrl)URL.revokeObjectURL(photoUrl);const f=$("portrait").files[0];if(f){photoUrl=URL.createObjectURL(f);$("preview").src=photoUrl;$("preview").hidden=false}};$("generate").onclick=async()=>{const btn=$("generate");if(!$("consent").checked||!$("voice").files[0]||!$("ref").value.trim()||!$("text").value.trim()){ $("status").textContent="অনুমতি, WAV অডিও এবং লেখা প্রয়োজন";return}const fd=new FormData();fd.append("reference",$("voice").files[0]);fd.append("ref_text",$("ref").value);fd.append("text",$("text").value);btn.disabled=true;$("status").textContent="ভয়েস তৈরি হচ্ছে...";try{const res=await fetch($("url").value.replace(/\/$/,"")+"/voice",{method:"POST",headers:{"X-API-Key":$("key").value},body:fd});if(!res.ok)throw Error("Server error "+res.status+": "+(await res.text()).slice(0,150));if(voiceUrl)URL.revokeObjectURL(voiceUrl);voiceUrl=URL.createObjectURL(await res.blob());$("player").src=voiceUrl;$("status").textContent="ভয়েস প্রস্তুত";await $("player").play().catch(()=>{})}catch(e){$("status").textContent=e.message}finally{btn.disabled=false}};</script></html>
