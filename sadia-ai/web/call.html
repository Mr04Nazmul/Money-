<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sadia AI · Call</title><style>*{box-sizing:border-box}body{margin:0;background:#09111b;color:#fff;font:16px system-ui}.app{max-width:500px;margin:auto;min-height:100dvh;background:radial-gradient(ellipse at 50% 30%,#315268,#09111b 75%);display:flex;flex-direction:column;padding:20px}.top{text-align:center}small{color:#b7c6d3}.stage{position:relative;flex:1;min-height:320px;display:grid;place-items:center}.avatar{width:min(76vw,320px);height:min(100vw,430px);border-radius:180px 180px 140px 140px;overflow:hidden;background:linear-gradient(130deg,#425a72,#b69b9c);box-shadow:0 0 65px #51d4c533;display:grid;place-items:center}.avatar img{width:100%;height:100%;object-fit:cover}.avatar .placeholder{font-size:120px}.speaking .avatar{animation:breathe .7s infinite alternate;box-shadow:0 0 75px #5ce5d5aa}.mouth{position:absolute;bottom:9%;left:50%;transform:translateX(-50%);width:34px;height:4px;border-radius:100%;background:#23171a;opacity:0;pointer-events:none}.speaking .mouth{opacity:.85;animation:talk .17s infinite alternate}@keyframes talk{to{height:23px;width:25px}}@keyframes breathe{to{transform:scale(1.012)}}.panel{background:#172431d9;padding:16px;border-radius:22px}input,textarea,button{font:inherit}textarea,input[type=url],input[type=password]{width:100%;background:#0b1621;border:1px solid #3b4c5b;color:white;border-radius:12px;padding:10px;margin:6px 0}button{border:0;background:#c7f4e8;color:#092b29;border-radius:40px;padding:12px 18px;font-weight:700}button.secondary{background:#334654;color:#fff}.controls{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:10px 0}details{margin-top:14px}label{display:block;margin:9px 0}#history{max-height:120px;overflow:auto;font-size:14px;color:#d3e2e6}#status{text-align:center;color:#c7f4e8;min-height:22px}audio{width:100%}</style></head><body><div class="app"><div class="top"><h2>সাদিয়া AI</h2><small>Private avatar call · browser demo</small></div><div id="stage" class="stage"><div class="avatar"><span id="placeholder" class="placeholder">👩</span><img id="photo" hidden alt="Your chosen portrait"></div><div class="mouth" aria-hidden="true"></div></div><div class="panel"><div id="status" role="status">ছবি বেছে নিয়ে কথা শুরু করো</div><div id="history" aria-live="polite"></div><div class="controls"><button id="mic">🎤 কথা বলো</button><button id="send">▶ উত্তর শোনো</button><button id="stop" class="secondary">■ থামাও</button></div><textarea id="message" rows="2" placeholder="বাংলায় কিছু লিখো বা মাইক্রোফোন ব্যবহার করো"></textarea><details><summary>⚙️ ছবি, কণ্ঠ ও সেটিংস</summary><label>নিজের ছবি <input id="portrait" type="file" accept="image/*"></label><label>নিজের WAV voice reference <input id="voice" type="file" accept=".wav,audio/wav"></label><label>WAV-এ ঠিক যা বলা হয়েছে <textarea id="ref" rows="2"></textarea></label><label>Private voice API URL <input id="url" type="url" placeholder="https://your-private-server"></label><label>Private API key <input id="key" type="password" autocomplete="off"></label><label><input id="consent" type="checkbox"> এই ছবি ও কণ্ঠ ব্যবহার করার অনুমতি আমার আছে</label><small>API না দিলে ডিভাইসের বাংলা TTS ব্যবহার হবে—এটি cloned voice নয়। ছবি ডিভাইসেই থাকে। AI conversation backend এখনো সংযুক্ত নয়; offline responses rule-based।</small></details><audio id="player" controls hidden></audio></div></div><script>
const $=id=>document.getElementById(id);let photoURL,audioURL,recognition;const conversation=[];
$('portrait').onchange=()=>{const f=$('portrait').files[0];if(!f)return;if(photoURL)URL.revokeObjectURL(photoURL);photoURL=URL.createObjectURL(f);$('photo').src=photoURL;$('photo').hidden=false;$('placeholder').hidden=true};
const status=s=>$('status').textContent=s;
const speakAnimation=on=>$('stage').classList.toggle('speaking',on);
function reply(s){if(/নাম|কে তুমি/.test(s))return 'আমি সাদিয়া এআই। তোমার সঙ্গে বাংলায় কথা বলছি।';if(/কেমন আছ/.test(s))return 'আমি ভালো আছি। তুমি কেমন আছো?';if(/হ্যালো|হাই|hello/i.test(s))return 'হ্যালো! আজ তোমার দিন কেমন যাচ্ছে?';return 'তোমার কথা শুনেছি। এটি অফলাইন ডেমো, তাই এখনো পুরো এআই উত্তর দিতে পারছি না।'}
function stop(){speechSynthesis.cancel();$('player').pause();speakAnimation(false);status('কল প্রস্তুত')}
$('stop').onclick=stop;
async function playResponse(t){if(!$('consent').checked){status('প্রথমে অনুমতির ঘরে টিক দাও');return}const url=$('url').value.trim();if(url&&$('voice').files[0]&&$('ref').value.trim()){const fd=new FormData();fd.append('reference',$('voice').files[0]);fd.append('ref_text',$('ref').value);fd.append('text',t);status('Private voice server-এ অনুরোধ পাঠানো হচ্ছে…');try{const r=await fetch(url.replace(/\/$/,'')+'/voice',{method:'POST',headers:{'X-API-Key':$('key').value},body:fd});if(!r.ok)throw Error('Voice API HTTP '+r.status);if(audioURL)URL.revokeObjectURL(audioURL);audioURL=URL.createObjectURL(await r.blob());$('player').src=audioURL;$('player').hidden=false;$('player').onplay=()=>speakAnimation(true);$('player').onended=()=>speakAnimation(false);await $('player').play();status('Private cloned voice audio চলছে');return}catch(e){status(e.message+' — ডিভাইসের voice fallback চলছে')}}if(!('speechSynthesis' in window)){status('এই browser-এ speech synthesis নেই');return}const u=new SpeechSynthesisUtterance(t);u.lang='bn-BD';u.rate=.92;u.onstart=()=>speakAnimation(true);u.onend=()=>speakAnimation(false);u.onerror=()=>speakAnimation(false);speechSynthesis.cancel();speechSynthesis.speak(u);status('ডিভাইসের বাংলা voice চলছে (clone নয়)')}
$('send').onclick=async()=>{const s=$('message').value.trim();if(!s){status('আগে কিছু বলো বা লেখো');return}const url=$('url').value.trim();let answer;conversation.push({role:'user',content:s});if(url){status('AI উত্তর তৈরি করছে…');try{const r=await fetch(url.replace(/\/$/,'')+'/chat',{method:'POST',headers:{'Content-Type':'application/json','X-API-Key':$('key').value},body:JSON.stringify({messages:conversation.slice(-20)})});if(!r.ok)throw Error('Chat API HTTP '+r.status);answer=(await r.json()).reply}catch(e){status(e.message+' — offline demo উত্তর')}}if(!answer)answer=reply(s);conversation.push({role:'assistant',content:answer});$('history').textContent='তুমি: '+s+'\nসাদিয়া: '+answer;await playResponse(answer)};
$('mic').onclick=()=>{const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){status('এই browser-এ speech recognition নেই; লিখে ব্যবহার করো');return}recognition=new R();recognition.lang='bn-BD';recognition.interimResults=false;recognition.onresult=e=>{$('message').value=e.results[0][0].transcript;status('শোনা হয়েছে; উত্তর শোনো চাপো')};recognition.onerror=e=>status('Microphone: '+e.error);recognition.start();status('শুনছি…')};
</script></body></html>
