<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101327">
<meta name="description" content="বাংলা প্লে — মজার গেম, কুইজ ও দৈনিক চ্যালেঞ্জের বাংলা বিনোদন ডেমো।">
<title>বাংলা প্লে | মজার গেম ও চ্যালেঞ্জ</title>
<style>
:root{--bg:#0d1020;--panel:#171b31;--panel2:#202642;--text:#f7f8ff;--muted:#aab0cb;--pink:#ff4e9b;--gold:#ffcc66;--cyan:#55e7e1;--line:#ffffff14}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#20294c 0,#0d1020 52%);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans Bengali",sans-serif;padding-bottom:86px}
button{font:inherit;cursor:pointer}.wrap{max-width:520px;margin:auto;min-height:100vh;padding:0 15px 22px}
header{display:flex;align-items:center;justify-content:space-between;padding:17px 0 14px;gap:10px}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:21px;letter-spacing:.2px}.logo{display:grid;place-items:center;width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,var(--pink),#865dff);box-shadow:0 8px 24px #ff4e9b33;font-size:23px}
.tag{font-size:11px;color:var(--cyan);border:1px solid #55e7e155;border-radius:99px;padding:6px 9px;white-space:nowrap}
.hero{position:relative;overflow:hidden;border:1px solid #ffffff1b;border-radius:25px;padding:23px 20px;background:linear-gradient(120deg,#6031a9,#b32f7c 58%,#f06c76);box-shadow:0 16px 38px #0003}
.hero:after{content:"✦";position:absolute;right:17px;top:4px;font-size:104px;color:#ffffff22;transform:rotate(15deg)}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:1px;color:#ffe4f1}.hero h1{font-size:29px;line-height:1.3;margin:8px 0 9px;max-width:310px}.hero p{font-size:13px;line-height:1.8;color:#fffde8;margin:0 0 17px;max-width:330px}
.primary{border:0;border-radius:13px;padding:12px 16px;background:#fff;color:#57215b;font-weight:900;box-shadow:0 6px 18px #0002}
.section-head{display:flex;align-items:center;justify-content:space-between;margin:23px 2px 12px}.section-head h2{font-size:17px;margin:0}.section-head span{font-size:12px;color:var(--muted)}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.quick button{border:1px solid var(--line);background:#ffffff09;color:var(--text);border-radius:17px;padding:13px 5px;display:flex;align-items:center;flex-direction:column;gap:7px}.quick .emoji{font-size:25px}.quick strong{font-size:12px}.quick small{font-size:10px;color:var(--muted)}
.featured{display:grid;grid-template-columns:1fr 1fr;gap:11px}.tile{min-height:142px;text-align:left;border:1px solid var(--line);border-radius:19px;padding:15px;background:linear-gradient(145deg,#252c4d,#171b31);color:var(--text);position:relative;overflow:hidden}.tile:nth-child(2){background:linear-gradient(145deg,#45305b,#211c3c)}.tile:nth-child(3){background:linear-gradient(145deg,#174d56,#172a40)}.tile:nth-child(4){background:linear-gradient(145deg,#624321,#2c2433)}.tile .art{font-size:34px;display:block;margin-bottom:12px}.tile strong{display:block;font-size:14px}.tile small{display:block;color:#c0c5dd;font-size:11px;margin-top:5px}.pill{display:inline-block;margin-top:10px;border-radius:99px;padding:5px 8px;background:#ffffff15;color:#fff;font-size:10px}
.notice{margin-top:17px;border:1px solid #55e7e133;background:#55e7e10b;border-radius:16px;padding:13px 14px;display:flex;gap:10px;align-items:flex-start}.notice b{font-size:12px}.notice p{font-size:11px;line-height:1.7;color:var(--muted);margin:3px 0 0}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#101327ed;backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:9px 10px calc(9px + env(safe-area-inset-bottom));display:flex;justify-content:center;z-index:5}.nav{width:100%;max-width:520px;display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.nav button{border:0;background:transparent;color:#9299b8;border-radius:12px;padding:7px 2px;font-size:10px;display:flex;flex-direction:column;align-items:center;gap:4px}.nav button span{font-size:19px}.nav button.active{background:#ff4e9b19;color:#ff82b6}
.toast{position:fixed;left:50%;bottom:95px;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#f7f8ff;color:#15182b;border-radius:13px;padding:11px 15px;font-size:13px;font-weight:700;box-shadow:0 8px 30px #0005;transition:.2s;z-index:9;width:max-content;max-width:90%}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(min-width:600px){body{padding-top:18px}.wrap{border:1px solid var(--line);border-radius:28px;margin-bottom:18px;background:#0d1020}.bottom{background:#101327f5}}
</style>
</head>
<body>
<div class="wrap">
<header><div class="brand"><div class="logo">🎮</div><div>বাংলা <span style="color:#ff70b0">প্লে</span></div></div><div class="tag">● ফান জোন</div></header>
<main>
<section class="hero"><div class="eyebrow">স্বাগতম · WELCOME</div><h1>খেলো, শেখো,<br>মজা করো! ✨</h1><p>বাংলায় ছোট ছোট গেম, কুইজ আর দৈনিক চ্যালেঞ্জ—সব এক জায়গায়।</p><button class="primary" onclick="showToast('🎉 দারুণ! নতুন চ্যালেঞ্জ শিগগিরই আসছে।')">চ্যালেঞ্জ দেখো&nbsp; →</button></section>
<div class="section-head"><h2>⚡ দ্রুত বেছে নাও</h2><span>তোমার পছন্দ</span></div>
<section class="quick">
<button onclick="showToast('🧠 কুইজ বিভাগ শিগগিরই আসছে!')"><span class="emoji">🧠</span><strong>মিনি কুইজ</strong><small>জ্ঞান যাচাই</small></button>
<button onclick="showToast('🧩 পাজল বিভাগ শিগগিরই আসছে!')"><span class="emoji">🧩</span><strong>পাজল</strong><small>মাথা খাটাও</small></button>
<button onclick="showToast('🏆 পয়েন্ট শুধু মজার জন্য—কোনো নগদ মূল্য নেই।')"><span class="emoji">🏆</span><strong>ব্যাজ</strong><small>মাইলস্টোন</small></button>
</section>
<div class="section-head"><h2>🌟 জনপ্রিয় বিভাগ</h2><span>ডেমো</span></div>
<section class="featured">
<button class="tile" onclick="showToast('🎯 টার্গেট গেম শিগগিরই আসছে!')"><span class="art">🎯</span><strong>টার্গেট চ্যালেঞ্জ</strong><small>ফোকাস ও নির্ভুলতা</small><span class="pill">শিগগিরই</span></button>
<button class="tile" onclick="showToast('🧠 বাংলা কুইজ শিগগিরই আসছে!')"><span class="art">💡</span><strong>বাংলা কুইজ</strong><small>প্রতিদিন নতুন প্রশ্ন</small><span class="pill">শিগগিরই</span></button>
<button class="tile" onclick="showToast('🧩 ব্রেইন পাজল শিগগিরই আসছে!')"><span class="art">🧩</span><strong>ব্রেইন পাজল</strong><small>ধাঁধা সমাধান করো</small><span class="pill">শিগগিরই</span></button>
<button class="tile" onclick="showToast('🎨 ক্রিয়েটিভ কর্নার শিগগিরই আসছে!')"><span class="art">🎨</span><strong>ক্রিয়েটিভ কর্নার</strong><small>নিজের আইডিয়া সাজাও</small><span class="pill">শিগগিরই</span></button>
</section>
<section class="notice"><span style="font-size:20px">🛡️</span><div><b>নিরাপদ বিনোদন</b><p>এটি একটি বিনোদনমূলক ডেমো। এখানে কোনো টাকা জমা, বাজি, জুয়া বা নগদ পুরস্কার নেই।</p></div></section>
</main>
</div>
<nav class="bottom"><div class="nav"><button class="active" onclick="setNav(this,'হোম')"><span>⌂</span>হোম</button><button onclick="setNav(this,'গেম')"><span>🎮</span>গেম</button><button onclick="setNav(this,'চ্যালেঞ্জ')"><span>🏅</span>চ্যালেঞ্জ</button><button onclick="setNav(this,'প্রোফাইল')"><span>👤</span>প্রোফাইল</button></div></nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
let timer;function showToast(message){const el=document.getElementById('toast');el.textContent=message;el.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>el.classList.remove('show'),2600)}
function setNav(button,label){document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));button.classList.add('active');if(label!=='হোম')showToast(label+' বিভাগটি শিগগিরই আসছে!')}
</script>
</body>
</html>
