name: Japan Cycle Guide Play Store AAB
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'cycle-guide/**'
      - '.github/workflows/japan-cycle-guide-play-store.yml'
jobs:
  build-android-aab:
    runs-on: ubuntu-24.04
    steps:
      - name: Check Expo token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "Missing EXPO_TOKEN in repository Actions secrets."
            exit 1
          fi
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          package-manager-cache: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK components
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)" && test -n "$SDKMANAGER" && yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses && "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"
      - name: Install dependencies
        working-directory: cycle-guide
        run: npm install
      - name: Set up EAS
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          eas-cache: false
      - name: Initialize or link EAS project
        working-directory: cycle-guide
        run: npx eas-cli@latest init --force --non-interactive
      - name: Build Android production AAB for Google Play
        working-directory: cycle-guide
        run: mkdir -p artifacts && npx eas-cli@latest build --platform android --profile production --non-interactive --local --output ./artifacts/japan-cycle-guide.aab
      - name: Upload Play Store AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: japan-cycle-guide-aab
          path: cycle-guide/artifacts/japan-cycle-guide.aab
          if-no-files-found: error
