name: Japan Cycle Guide Play Store AAB
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'cycle-guide/**'
      - '.github/workflows/japan-cycle-guide-play-store.yml'
jobs:
  build-android-aab:
    runs-on: ubuntu-24.04
    steps:
      - name: Check Expo token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "Missing EXPO_TOKEN in repository Actions secrets."
            exit 1
          fi
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Install dependencies
        working-directory: cycle-guide
        run: npm install
      - name: Set up EAS
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          eas-cache: false
      - name: Initialize or link EAS project
        working-directory: cycle-guide
        run: npx eas-cli@latest init --force --non-interactive
      - name: Build Android production AAB for Google Play
        working-directory: cycle-guide
        run: npx eas-cli@latest build --platform android --profile production --non-interactive --no-wait
