name: Japan Cycle Guide Android Build
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'cycle-guide/**'
      - '.github/workflows/japan-cycle-guide-build.yml'
jobs:
  build-android:
    runs-on: ubuntu-24.04
    steps:
      - name: Check Expo token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "Missing EXPO_TOKEN in repository Actions secrets."
            exit 1
          fi
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          package-manager-cache: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK components
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)" && test -n "$SDKMANAGER" && yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses && "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"
      - name: Install dependencies
        working-directory: cycle-guide
        run: npm install
      - name: Set up EAS
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          eas-cache: false
      - name: Initialize or link EAS project
        working-directory: cycle-guide
        run: npx eas-cli@latest init --force --non-interactive
      - name: Build Android preview APK
        working-directory: cycle-guide
        run: mkdir -p artifacts && npx eas-cli@latest build --platform android --profile preview --non-interactive --local --output ./artifacts/japan-cycle-guide.apk
      - name: Launch APK on Android emulator and check for startup crash
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          script: |
            adb install -r cycle-guide/artifacts/japan-cycle-guide.apk
            adb logcat -c
            adb shell monkey -p com.mr04nazmul.japancycleguide 1
            sleep 25
            adb logcat -d -t 5000 > cycle-guide/artifacts/emulator-logcat.txt
            if ! adb shell pidof com.mr04nazmul.japancycleguide; then
              echo "App process is not running after launch. Recent crash logs:"
              grep -E -i "FATAL EXCEPTION|AndroidRuntime|Fatal signal|com.mr04nazmul.japancycleguide" cycle-guide/artifacts/emulator-logcat.txt | tail -n 120 || true
              exit 1
            fi
            echo "App process is still running after 25 seconds."
      - name: Upload emulator startup log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: japan-cycle-guide-emulator-log
          path: cycle-guide/artifacts/emulator-logcat.txt
          if-no-files-found: ignore
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: japan-cycle-guide-apk
          path: cycle-guide/artifacts/japan-cycle-guide.apk
          if-no-files-found: error
