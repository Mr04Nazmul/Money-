name: Expo Android Install Link

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/expo-install-link.yml'

jobs:
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cycle-guide
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cycle-guide/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build installable APK on Expo EAS
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas-cli@latest build --platform android --profile preview --non-interactive --wait
