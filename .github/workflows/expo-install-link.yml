name: Expo Android Install Link

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/expo-install-link.yml'
      - 'cycle-guide/**'

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cycle-guide
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Check Expo dependency compatibility
        run: npx expo-doctor

      - name: Verify Expo token is configured
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Repository secret EXPO_TOKEN is missing. Add it in Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Link or create Expo project
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas-cli@latest init --account money-wallet --non-interactive

      - name: Save Expo project link to repository
        working-directory: .
        run: |
          if ! git diff --quiet -- cycle-guide/app.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add cycle-guide/app.json
            git commit -m "Link Japan Cycle Guide to Expo EAS"
            git push
          fi

      - name: Build installable APK on Expo EAS
        working-directory: cycle-guide
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas-cli@latest build --platform android --profile preview --non-interactive --wait
