<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Community Guestbook</title><style>body{font:16px system-ui;background:#f3f6fb;color:#162238;margin:0;padding:2rem}main{max-width:620px;margin:auto;background:white;padding:2rem;border-radius:18px;box-shadow:0 6px 28px #0001}input,textarea,button{font:inherit;padding:12px;border-radius:8px;border:1px solid #ccd3de;width:100%;box-sizing:border-box;margin:8px 0}button{background:#2458cb;color:white;cursor:pointer}li{margin:12px 0}</style></head><body><main><h1>Community Guestbook</h1><p>Leave a friendly public message. Don't share passwords or private information.</p><form id="form"><label>Display name<input id="name" maxlength="50" required></label><label>Message<textarea id="message" maxlength="500" required></textarea></label><button>Post message</button></form><p id="status" role="status"></p><h2>Messages</h2><ul id="messages"></ul></main><script type="module">import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';const url='YOUR_SUPABASE_URL',key='YOUR_SUPABASE_ANON_KEY';const status=document.querySelector('#status');if(url.startsWith('YOUR_')){status.textContent='Setup needed: configure Supabase URL and publishable/anon key in index.html';}else{const db=createClient(url,key);async function refresh(){const {data,error}=await db.from('guestbook_entries').select('display_name,message,created_at').order('created_at',{ascending:false}).limit(50);if(error){status.textContent='Could not load messages';return}const ul=document.querySelector('#messages');ul.replaceChildren();for(const item of data){const li=document.createElement('li');li.textContent=item.display_name+': '+item.message;ul.append(li)}}document.querySelector('#form').addEventListener('submit',async e=>{e.preventDefault();const display_name=document.querySelector('#name').value.trim(),message=document.querySelector('#message').value.trim();if(!display_name||!message)return;const {error}=await db.from('guestbook_entries').insert({display_name,message});status.textContent=error?'Unable to post message':'Message submitted';if(!error){e.target.reset();refresh()}});refresh()}</script></body></html>
